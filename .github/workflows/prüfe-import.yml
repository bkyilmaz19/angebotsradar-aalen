name: Importänderungen prüfen
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python-Tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript-Syntaxprüfung
        run: node --check app.js
