name: Offene Preisbeobachtungen abrufen
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: offene-preisbeobachtungen
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open Prices Aalen abrufen
        run: python scripts/import_open_prices.py
      - name: Lizenzierte Daten aktualisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Offene regionale Preisbeobachtungen aktualisieren"
            git push
          fi
