name: Lidl-Angebote Aalen aktualisieren
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_lidl.py'
      - '.github/workflows/lidl-offers.yml'
  schedule:
    - cron: '40 8,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: angebotsradar-schreibzugriff
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unabhängigen Lidl-Client laden
        run: |
          git clone --depth 1 https://github.com/EvickaStudio/lidl-discounts.git /tmp/lidl-discounts
          python -m pip install httpx pydantic pydantic-settings python-dotenv
      - name: Lidl Aalen Angebote abrufen und validieren
        run: python scripts/import_lidl.py
      - name: Validierte Preisdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Lidl Angebotsdaten aktualisieren"
            git push
          fi
