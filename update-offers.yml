name: Angebote täglich aktualisieren
on:
  schedule:
    - cron: '17 6,18 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Angebotsdaten abrufen und prüfen
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_API_KEY: ${{ secrets.FEED_API_KEY }}
        run: python scripts/update_offers.py
      - name: Aktualisierte Daten veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Angebotsdaten aktualisieren"
            git push
          fi
